<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你好，我是陈彦霖</title>
<style>
  :root{
    --bg-1:#0d1117;
    --bg-2:#141b2d;
    --ink:#e9eef7;
    --ink-soft:#98a5bd;
    --line:rgba(255,255,255,.10);
    --card:rgba(255,255,255,.045);
    --accent:#5eead4;
    --accent-2:#7c9cff;
  }

  *{box-sizing:border-box;}

  html{-webkit-text-size-adjust:100%;}

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.7;
    background:
      radial-gradient(900px 600px at 12% -10%, rgba(124,156,255,.22), transparent 60%),
      radial-gradient(800px 520px at 92% 8%, rgba(94,234,212,.16), transparent 62%),
      linear-gradient(170deg,var(--bg-1),var(--bg-2) 55%,#0b0f17);
    background-attachment:fixed;
  }

  /* 背景细网格：纯 CSS，无外部图片 */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 72%);
  }

  .page{
    position:relative;
    width:100%;
    max-width:880px;
  }

  /* ---------- 顶部名片 ---------- */
  .hero{
    display:flex;
    gap:28px;
    align-items:center;
    padding:34px;
    border:1px solid var(--line);
    border-radius:22px;
    background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9);
    backdrop-filter:blur(6px);
    animation:rise .7s cubic-bezier(.2,.7,.3,1) both;
  }

  .avatar{
    flex:0 0 auto;
    width:112px;
    height:112px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:conic-gradient(from 210deg, var(--accent), var(--accent-2), var(--accent));
    box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 18px 40px -18px rgba(94,234,212,.7);
  }

  .avatar svg{width:104px;height:104px;border-radius:50%;display:block;}

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    letter-spacing:.06em;
    color:var(--accent);
    padding:5px 12px;
    border:1px solid rgba(94,234,212,.35);
    border-radius:999px;
    background:rgba(94,234,212,.08);
  }

  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
  }

  h1{
    margin:14px 0 6px;
    font-size:clamp(28px,5vw,40px);
    line-height:1.2;
    letter-spacing:.02em;
    font-weight:700;
  }

  h1 .hanzi{
    background:linear-gradient(100deg,var(--accent) 0%,var(--accent-2) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .meta{
    margin:0;
    color:var(--ink-soft);
    font-size:15px;
  }

  .meta span{color:var(--ink);}

  .divider{
    height:1px;
    margin:22px 0 0;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
  }

  /* ---------- 三个目标 ---------- */
  .section-title{
    display:flex;
    align-items:baseline;
    gap:12px;
    margin:52px 0 20px;
    font-size:15px;
    letter-spacing:.14em;
    color:var(--ink-soft);
    font-weight:500;
  }

  .section-title::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg,var(--line),transparent);
  }

  .cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
  }

  .card{
    position:relative;
    overflow:hidden;
    padding:26px 22px 28px;
    border:1px solid var(--line);
    border-radius:18px;
    background:var(--card);
    transition:transform .35s cubic-bezier(.2,.7,.3,1), border-color .35s, background .35s;
    animation:rise .7s cubic-bezier(.2,.7,.3,1) both;
  }

  .card:nth-child(1){animation-delay:.08s;}
  .card:nth-child(2){animation-delay:.16s;}
  .card:nth-child(3){animation-delay:.24s;}

  .card::after{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius:18px;
    padding:1px;
    background:linear-gradient(140deg, rgba(94,234,212,.55), rgba(124,156,255,.55));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    opacity:0;
    transition:opacity .35s;
    pointer-events:none;
  }

  .card:hover{transform:translateY(-6px);background:rgba(255,255,255,.07);}
  .card:hover::after{opacity:1;}

  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }

  .icon{
    width:44px;height:44px;
    display:grid;place-items:center;
    border-radius:12px;
    background:linear-gradient(150deg, rgba(94,234,212,.16), rgba(124,156,255,.16));
    border:1px solid var(--line);
    color:var(--accent);
  }

  .icon svg{width:22px;height:22px;display:block;}

  .num{
    font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:.08em;
  }

  .card h2{
    margin:0 0 8px;
    font-size:18px;
    font-weight:600;
    letter-spacing:.01em;
  }

  .card p{
    margin:0;
    font-size:14.5px;
    color:var(--ink-soft);
  }

  footer{
    margin-top:44px;
    text-align:center;
    font-size:13px;
    color:rgba(152,165,189,.75);
    letter-spacing:.04em;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:none;}
  }

  @media (max-width:820px){
    .cards{grid-template-columns:1fr;}
    .hero{flex-direction:column;text-align:center;align-items:center;padding:30px 22px;}
    .section-title{margin-top:40px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
  <main class="page">

    <header class="hero">
      <div class="avatar" aria-hidden="true">
        <!-- 内嵌 SVG 头像：纯手绘字符，不引用任何外部图片 -->
        <svg viewBox="0 0 104 104" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="g" cx="35%" cy="28%" r="78%">
              <stop offset="0%" stop-color="#1b2540"/>
              <stop offset="100%" stop-color="#0b0f17"/>
            </radialGradient>
          </defs>
          <circle cx="52" cy="52" r="52" fill="url(#g)"/>
          <circle cx="52" cy="52" r="43" fill="none" stroke="rgba(94,234,212,.35)" stroke-width="1"/>
          <text x="52" y="66" text-anchor="middle"
                font-family="'PingFang SC','Microsoft YaHei',sans-serif"
                font-size="38" font-weight="600" fill="#5eead4">陈</text>
        </svg>
      </div>

      <div class="info">
        <span class="badge"><i class="dot"></i>实验室新生</span>
        <h1>你好，我是<span class="hanzi">陈彦霖</span></h1>
        <p class="meta">就读于 <span>人工智能</span> 专业 · 26级</p>
      </div>
    </header>

    <div class="section-title">想在实验室达成的三个目标</div>

    <section class="cards">

      <article class="card">
        <div class="card-head">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6h16M4 12h10M4 18h6"/>
            </svg>
          </div>
          <span class="num">01</span>
        </div>
        <h2>学会 C 语言</h2>
        <p>不满足于看懂语法，而是能自己写出可编译、可调试、跑得通的程序，把指针和内存这些硬骨头一块块啃下来。</p>
      </article>

      <article class="card">
        <div class="card-head">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 6l-3 12"/>
            </svg>
          </div>
          <span class="num">02</span>
        </div>
        <h2>看懂一个工程</h2>
        <p>学会从入口开始梳理陌生项目的结构，看清模块之间的调用关系，而不是只盯着某一行代码猜它的作用。</p>
      </article>

      <article class="card">
        <div class="card-head">
          <div class="icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16v-3.5l2-3.5h12l2 3.5V16"/>
              <path d="M4 16h16"/>
              <circle cx="7.5" cy="17.2" r="1.7"/>
              <circle cx="16.5" cy="17.2" r="1.7"/>
            </svg>
          </div>
          <span class="num">03</span>
        </div>
        <h2>做出一辆智能小车</h2>
        <p>从点亮第一个电机开始，把传感器、控制逻辑和结构件拼到一起，让这辆小车真正自己跑起来。</p>
      </article>

    </section>

    <footer>人工智能 · 26级 · 实验室新生</footer>
  </main>
</body>
</html>
